    # ========= Perfil de desarrollo (tu PC) =========
    spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:bbva}
    spring.datasource.username=postgres
    spring.datasource.password=${DB_PASSWORD:12345}

    spring.jpa.show-sql=false
    logging.level.pe.bbva.backend=DEBUG

    # ---------- Correo (Gmail) ----------
    # 1) Pon app.mail-enabled=true
    # 2) Usa una "contrasena de aplicacion" de Google, no la contrasena normal
    # Mientras este en false, el codigo de verificacion se muestra en la consola.
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=${MAIL_USERNAME:correo.del.grupo@gmail.com}
    spring.mail.password=${MAIL_PASSWORD:}
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true
