# ==========================================================
#  Sistema de Deteccion de Fraude en Tarjetas con IA y ML
#  BBVA - Agencia Piura
# ==========================================================
spring.application.name=backend
spring.profiles.active=dev
server.port=8080

# ---------- JPA / Hibernate ----------
# Hibernate crea y actualiza las tablas solo a partir de las clases de model (sin Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ---------- Jackson ----------
spring.jackson.time-zone=America/Lima

# ---------- JWT ----------
# Clave en Base64 de al menos 32 bytes. Cambiala en produccion.
app.jwt.secret=${JWT_SECRET:ZnJhdWRlLWJidmEtcGl1cmEtY2xhdmUtc2VjcmV0YS0yMDI2LXNlZ3VyaWRhZC1qd3Q=}
app.jwt.access-expiration-minutes=60
app.jwt.refresh-expiration-days=7

# ---------- Microservicio de IA (FastAPI) ----------
app.ia.enabled=true
app.ia.url=${IA_URL:http://localhost:8000}
app.ia.api-key=${IA_API_KEY:clave-interna-bbva-ml}
app.ia.timeout-ms=2000

# ---------- Motor de riesgo (valores iniciales, luego se editan en /api/parametros) ----------
app.riesgo.umbral-alerta=0.70
app.riesgo.umbral-critico=0.90
app.riesgo.peso-ia=0.70

# ---------- Recuperacion de contrasena ----------
app.recuperacion.vigencia-minutos=10
app.recuperacion.max-intentos=3
app.recuperacion.espera-reenvio-segundos=60
app.recuperacion.vigencia-reset-minutos=15

# ---------- Aplicacion ----------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_USERNAME:no-reply@bbva-fraude.pe}
app.notificacion-vigencia-minutos=15
app.datos-demo=true

# ---------- Paginacion: JSON estable { content: [...], page: {...} } ----------
spring.data.web.pageable.serialization-mode=via-dto

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
